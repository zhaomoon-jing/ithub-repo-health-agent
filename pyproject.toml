[project]
name = "repo-health-agent"
version = "0.1.0"
description = "GitHub 仓库深度体检 Agent - 多 Agent 编排，clone 代码做真实静态分析，输出带证据的健康报告"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "langgraph>=1.2",
    "radon>=6.0",
    "ruff>=0.6",
    "bandit>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
